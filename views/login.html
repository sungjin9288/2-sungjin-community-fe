<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <header class="header-simple">
        <div class="header-container">
            <h1 class="header-title">아무 말 대잔치</h1>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">로그인</h2>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="이메일을 입력해 주세요" autocomplete="email" required>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-submit">로그인</button>
            </form>

            <div class="auth-footer">
                <p>회원이 아니신가요?</p>
                <a href="/signup" class="link-secondary">회원가입</a>
            </div>
        </div>
    </main>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth/login.js"></script>
</body>

</html>

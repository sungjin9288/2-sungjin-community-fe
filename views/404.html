<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 페이지를 찾을 수 없습니다</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .error-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-container {
            max-width: 560px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            background: var(--color-bg-card);
            padding: 36px 24px;
        }

        .error-code {
            font-size: 84px;
            font-weight: 800;
            line-height: 1;
            color: var(--color-primary);
            margin-bottom: 10px;
        }

        .error-title {
            color: var(--color-text-main);
            font-size: 30px;
            margin-bottom: 12px;
        }

        .error-message {
            color: var(--color-text-sub);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .error-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-error {
            min-width: 140px;
            padding: 11px 18px;
            border: 1px solid var(--color-border);
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-error-primary {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }

        .btn-error-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-error-secondary {
            background: transparent;
            color: var(--color-text-sub);
        }

        .btn-error-secondary:hover {
            color: var(--color-text-main);
            border-color: var(--color-primary);
        }
    </style>
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <main class="error-main">
        <section class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">페이지를 찾을 수 없습니다.</h1>
            <p class="error-message">
                요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>
                아래 버튼으로 이전 화면으로 돌아가세요.
            </p>
            <div class="error-buttons">
                <button class="btn-error btn-error-primary" data-navigate="/login">로그인으로 이동</button>
                <button class="btn-error btn-error-secondary" data-history-back="true">이전 페이지</button>
            </div>
        </section>
    </main>

    <script src="/js/utils.js"></script>
</body>

</html>

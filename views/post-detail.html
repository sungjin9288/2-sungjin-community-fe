<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/posts.css">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <div id="headerSlot" data-title="아무 말 대잔치" data-back-action="history"></div>

    <main class="post-detail-main">
        <div class="post-detail-container">
            <div class="post-header">
                <h1 id="postTitle" class="post-title"><div class="skeleton skeleton-text medium" style="height: 36px;"></div></h1>
                <div class="post-actions" id="postActions" style="display: none;">
                    <button class="btn-edit" id="btnEditPost">수정</button>
                    <button class="btn-delete" id="btnDeletePost">삭제</button>
                </div>
            </div>

            <div class="post-meta">
                <div class="author-info">
                    <img id="authorImage" src="/images/default-profile.png" alt="작성자 프로필" class="author-avatar">
                    <div>
                        <p id="authorName" class="author-name">작성자</p>
                        <p id="postDate" class="post-date">날짜</p>
                    </div>
                </div>
                <div class="post-meta-actions">
                    <button id="btnBookmarkToggle" class="message-author-button">북마크</button>
                    <button id="btnReportPost" class="message-author-button" style="display: none;">게시글 신고</button>
                    <button id="btnBlockAuthor" class="message-author-button" style="display: none;">작성자 차단</button>
                    <button id="btnMessageAuthor" class="message-author-button" style="display: none;">작성자에게 메시지</button>
                </div>
            </div>

            <div class="post-content">
                <div id="postImage" class="post-image" style="display: none;"></div>
                <div id="postBody" class="post-body">
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text medium"></div>
                    <br>
                    <div class="skeleton skeleton-text short"></div>
                </div>
            </div>

            <div class="post-stats">
                <div class="stat-item">
                    <span id="viewCount">0</span>
                    <span>조회수</span>
                </div>
                <div class="stat-item">
                    <span id="likeCount">0</span>
                    <span>좋아요</span>
                </div>
                <div class="stat-item">
                    <span id="commentCount">0</span>
                    <span>댓글</span>
                </div>
            </div>

            <div class="like-section">
                <button id="likeButton" class="btn-like">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                    </svg>
                    <span id="likeText">좋아요</span>
                </button>
            </div>

            <div class="comments-section">
                <h3 class="comments-title">댓글</h3>

                <div class="comment-input-container">
                    <div id="replyTargetBar" class="reply-target-bar" style="display: none;">
                        <span id="replyTargetText">답글 작성 중</span>
                        <button id="btnCancelReply" type="button" class="btn-comment-cancel">답글 취소</button>
                    </div>
                    <textarea id="commentInput" class="comment-input auto-resize" placeholder="댓글을 입력해 주세요" rows="3"></textarea>
                    <button class="btn-comment-submit" id="btnSubmitComment">댓글 등록</button>
                </div>

                <div id="commentsList" class="comments-list">
                    <div class="comment-item" style="pointer-events: none; border-bottom: none;">
                        <div class="comment-header">
                            <div class="comment-author" style="width: 100%;">
                                <div class="skeleton skeleton-circle comment-avatar"></div>
                                <div style="flex: 1;">
                                    <div class="skeleton skeleton-text short"></div>
                                    <div class="skeleton skeleton-text" style="width: 30%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="skeleton skeleton-text medium"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>게시글을 삭제하시겠습니까?</h3>
            <p>삭제된 내용은 복구할 수 없습니다.</p>
            <div class="modal-buttons">
                <button class="btn-modal cancel" id="btnCancelDelete">취소</button>
                <button class="btn-modal danger" id="btnConfirmDelete">확인</button>
            </div>
        </div>
    </div>

    <div id="commentModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>댓글을 삭제하시겠습니까?</h3>
            <p>삭제된 내용은 복구할 수 없습니다.</p>
            <div class="modal-buttons">
                <button class="btn-modal cancel" id="btnCancelCommentModal">취소</button>
                <button class="btn-modal danger" id="btnConfirmCommentModal">확인</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/posts/detail.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <div id="headerSlot" data-title="아무 말 대잔치" data-back-target="/posts"></div>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">회원정보수정</h2>
            </div>

            <form id="profileEditForm" class="auth-form">
                <div class="form-group">
                    <label>프로필 사진</label>
                    <div class="profile-upload">
                        <div class="profile-preview" id="btnSelectImage" style="cursor: pointer; position: relative;">
                            <img id="previewImage" src="/images/default-profile.png" alt="프로필 미리보기">
                            <div class="profile-overlay">변경</div>
                        </div>
                        <input type="file" id="profileImage" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" class="form-input" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" class="form-input" placeholder="닉네임을 입력해 주세요" maxlength="10" required>
                    <span class="form-error" id="nicknameError"></span>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">수정하기</button>
            </form>

            <div class="auth-footer">
                <button id="btnWithdraw" class="btn-withdraw">회원 탈퇴</button>
            </div>
        </div>
    </main>

    <div id="withdrawModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>회원 탈퇴 하시겠습니까?</h3>
            <p>작성한 게시글과 댓글이 모두 삭제됩니다.</p>
            <div class="modal-actions">
                <button id="btnCancelWithdraw" class="btn-cancel">취소</button>
                <button id="btnConfirmWithdraw" class="btn-danger">확인</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/profile/edit.js"></script>
</body>

</html>

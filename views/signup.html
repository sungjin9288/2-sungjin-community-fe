<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <header class="header-simple">
        <div class="header-container">
            <button class="btn-back" type="button" aria-label="뒤로 가기" data-history-back="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="header-title">아무 말 대잔치</h1>
            <div class="header-spacer"></div>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">회원가입</h2>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="profile-upload">
                    <span class="profile-label">프로필 사진*</span>
                    <label class="profile-preview" id="profilePreview" for="profileImage" role="button" tabindex="0" aria-label="프로필 사진 선택">
                        <div class="profile-placeholder">+</div>
                    </label>
                    <input type="file" id="profileImage" class="profile-input" accept="image/*" required>
                    <button type="button" class="btn-remove-profile" id="btnRemoveProfileImage" hidden>사진 삭제</button>
                    <span class="form-error" id="profileError"></span>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <div class="helper-row">
                        <input type="email" id="email" name="email" class="form-input" placeholder="이메일을 입력해 주세요" autocomplete="email" required>
                        <button type="button" class="btn-helper" id="btnCheckEmail">중복확인</button>
                    </div>
                    <span class="form-helper" id="emailHelper">@를 포함한 이메일 형식으로 입력해 주세요.</span>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호*</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력해 주세요" autocomplete="new-password" required>
                    <span class="form-helper" id="passwordHelper">8~20자, 대문자/소문자/숫자/특수문자를 각각 1개 이상 포함해 주세요.</span>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">비밀번호 확인*</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-input" placeholder="비밀번호를 한 번 더 입력해 주세요" autocomplete="new-password" required>
                    <span class="form-error" id="passwordConfirmError"></span>
                </div>

                <div class="form-group">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" name="nickname" class="form-input" placeholder="닉네임을 입력해 주세요" maxlength="10" autocomplete="nickname" required>
                    <span class="form-helper" id="nicknameHelper">닉네임은 1~10자까지 작성 가능합니다.</span>
                    <span class="form-error" id="nicknameError"></span>
                </div>

                <button type="submit" class="btn-submit">회원가입</button>
            </form>

            <div class="auth-footer">
                <a href="/login" class="link-secondary">로그인하러 가기</a>
            </div>
        </div>
    </main>

    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p>회원가입이 완료되었습니다.</p>
            <div class="modal-buttons">
                <button class="btn-modal primary" id="btnCloseModal">확인</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth/signup.js"></script>
</body>

</html>

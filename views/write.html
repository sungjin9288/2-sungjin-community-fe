<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/write.css">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="아무 말 대잔치">
    <meta property="og:title" content="아무 말 대잔치 - 커뮤니티">
    <meta property="og:description" content="트렌디하고 힙한 글로벌 커뮤니티, 아무 말 대잔치">
    <meta property="og:image" content="/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <div id="headerSlot" data-title="아무 말 대잔치" data-back-action="history"></div>

    <main class="write-main">
        <div class="write-container">
            <div class="write-header">
                <h2 class="page-title">게시글 작성</h2>
            </div>

            <form id="writeForm" class="write-form">
                <div class="form-group">
                    <label for="title">제목*</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-input"
                        placeholder="제목을 입력해 주세요 (최대 26자)"
                        maxlength="26"
                        required
                    >
                    <span class="form-error" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="content">
                        내용*
                        <span style="float: right; font-size: 12px; font-weight: 400; color: var(--color-text-sub);">마크다운(Markdown) 문법을 지원합니다.</span>
                    </label>
                    <textarea
                        id="content"
                        name="content"
                        class="form-textarea auto-resize"
                        placeholder="내용을 입력해 주세요"
                        rows="10"
                        required
                    ></textarea>
                    <span class="form-error" id="contentError"></span>
                </div>

                <div class="form-group">
                    <label for="tags">태그</label>
                    <input
                        type="text"
                        id="tags"
                        name="tags"
                        class="form-input"
                        placeholder="#frontend, react, 일상"
                    >
                    <p class="form-helper">쉼표(,)로 구분해 입력하세요. 최대 5개까지 저장됩니다.</p>
                </div>

                <div class="form-group">
                    <label for="image">이미지</label>
                    <div class="image-upload">
                        <input type="file" id="image" accept="image/*" style="display: none;">
                        <label for="image" class="image-upload-label">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path
                                    d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />
                            </svg>
                            <span id="imageLabel">파일을 선택해 주세요</span>
                        </label>
                    </div>
                    <div id="imagePreview" class="image-preview" style="display: none;">
                        <img id="previewImg" src="" alt="업로드 이미지 미리보기">
                        <button type="button" id="btnRemoveImage" class="btn-remove-image" aria-label="이미지 삭제">×</button>
                    </div>
                </div>

                <span class="form-helper" id="formHelper" style="color: var(--color-danger);">
                    제목과 내용을 모두 작성해 주세요.
                </span>
                <button type="submit" class="btn-submit">작성</button>
            </form>
        </div>
    </main>

    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p>게시글이 등록되었습니다.</p>
            <div class="modal-buttons">
                <button class="btn-modal" id="btnConfirmModal">확인</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/posts/write.js"></script>
</body>

</html>

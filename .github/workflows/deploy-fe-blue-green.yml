name: Deploy Frontend Blue Green To EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      deploy_target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Resolve variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::12}"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_TARGET="prod"
          else
            DEPLOY_TARGET="staging"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$DEPLOY_TARGET" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/community-frontend:${{ steps.vars.outputs.image_tag }}

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: needs.build_and_push.outputs.deploy_target == 'staging'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare SSH key
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.STAGING_FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY != '' && secrets.STAGING_FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY || secrets.FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy FE blue/green (staging)
        shell: bash
        env:
          EC2_HOST: ${{ secrets.STAGING_FE_BLUEGREEN_EC2_HOST != '' && secrets.STAGING_FE_BLUEGREEN_EC2_HOST || secrets.FE_BLUEGREEN_EC2_HOST }}
          EC2_USER: ${{ secrets.STAGING_FE_BLUEGREEN_EC2_USER != '' && secrets.STAGING_FE_BLUEGREEN_EC2_USER || secrets.FE_BLUEGREEN_EC2_USER }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          API_URL: ${{ secrets.STAGING_FE_BLUEGREEN_API_URL != '' && secrets.STAGING_FE_BLUEGREEN_API_URL || secrets.FE_BLUEGREEN_API_URL }}
          FILE_UPLOAD_API_URL: ${{ secrets.STAGING_FE_BLUEGREEN_FILE_UPLOAD_API_URL != '' && secrets.STAGING_FE_BLUEGREEN_FILE_UPLOAD_API_URL || secrets.FE_BLUEGREEN_FILE_UPLOAD_API_URL }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/ec2-bluegreen-fe-deploy.sh
          API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            ./scripts/ec2-bluegreen-fe-deploy.sh "$EC2_HOST" "$EC2_USER" "$DOCKERHUB_USER" "$IMAGE_TAG" ./ec2_key.pem

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: needs.build_and_push.outputs.deploy_target == 'prod'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare SSH key
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.PROD_FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY != '' && secrets.PROD_FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY || secrets.FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy FE blue/green (production)
        shell: bash
        env:
          EC2_HOST: ${{ secrets.PROD_FE_BLUEGREEN_EC2_HOST != '' && secrets.PROD_FE_BLUEGREEN_EC2_HOST || secrets.FE_BLUEGREEN_EC2_HOST }}
          EC2_USER: ${{ secrets.PROD_FE_BLUEGREEN_EC2_USER != '' && secrets.PROD_FE_BLUEGREEN_EC2_USER || secrets.FE_BLUEGREEN_EC2_USER }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          API_URL: ${{ secrets.PROD_FE_BLUEGREEN_API_URL != '' && secrets.PROD_FE_BLUEGREEN_API_URL || secrets.FE_BLUEGREEN_API_URL }}
          FILE_UPLOAD_API_URL: ${{ secrets.PROD_FE_BLUEGREEN_FILE_UPLOAD_API_URL != '' && secrets.PROD_FE_BLUEGREEN_FILE_UPLOAD_API_URL || secrets.FE_BLUEGREEN_FILE_UPLOAD_API_URL }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/ec2-bluegreen-fe-deploy.sh
          API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            ./scripts/ec2-bluegreen-fe-deploy.sh "$EC2_HOST" "$EC2_USER" "$DOCKERHUB_USER" "$IMAGE_TAG" ./ec2_key.pem

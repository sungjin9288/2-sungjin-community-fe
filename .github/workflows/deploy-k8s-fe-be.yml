name: Build And Deploy FE/BE To Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (optional, default: sha-<12>)"
        required: false
        type: string
      backend_ref:
        description: "Backend git ref (optional, default: vars.BACKEND_REF or main)"
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  BACKEND_REPO: ${{ vars.BACKEND_REPO != '' && vars.BACKEND_REPO || '80-hours-a-week/2-sungjin-community-be' }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      backend_ref: ${{ steps.vars.outputs.backend_ref }}
      namespace: ${{ steps.vars.outputs.namespace }}
      deploy_target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Resolve deployment variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::12}"
          fi

          if [ -n "${{ github.event.inputs.backend_ref }}" ]; then
            BACKEND_REF="${{ github.event.inputs.backend_ref }}"
          elif [ -n "${{ vars.BACKEND_REF }}" ]; then
            BACKEND_REF="${{ vars.BACKEND_REF }}"
          else
            BACKEND_REF="main"
          fi

          if [ -n "${{ github.event.inputs.namespace }}" ]; then
            NAMESPACE="${{ github.event.inputs.namespace }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            NAMESPACE="production"
          else
            NAMESPACE="staging"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_TARGET="prod"
          else
            DEPLOY_TARGET="staging"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "backend_ref=$BACKEND_REF" >> "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$DEPLOY_TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ steps.vars.outputs.backend_ref }}
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN != '' && secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/community-frontend:${{ steps.vars.outputs.image_tag }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/community-backend:${{ steps.vars.outputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Export AWS credentials for EKS auth
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && secrets.PROD_AWS_ACCESS_KEY_ID || secrets.STAGING_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && secrets.PROD_AWS_SECRET_ACCESS_KEY || secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_VALUE: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.PROD_AWS_REGION != '' && vars.PROD_AWS_REGION || vars.AWS_REGION || 'ap-northeast-2') || (vars.STAGING_AWS_REGION != '' && vars.STAGING_AWS_REGION || vars.AWS_REGION || 'ap-northeast-2') }}
        run: |
          set -euo pipefail
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_VALUE"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_VALUE"
            echo "AWS_REGION=$AWS_REGION_VALUE"
            echo "AWS_DEFAULT_REGION=$AWS_REGION_VALUE"
          } >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify AWS identity for EKS auth
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Install envsubst
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y gettext-base

      - name: Prepare kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (secrets.KUBE_CONFIG_DATA_PROD != '' && secrets.KUBE_CONFIG_DATA_PROD || secrets.KUBE_CONFIG_DATA) || (secrets.KUBE_CONFIG_DATA_STAGING != '' && secrets.KUBE_CONFIG_DATA_STAGING || secrets.KUBE_CONFIG_DATA) }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config" 2>/dev/null; then
            echo "Decoded base64 kubeconfig"
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Render Kubernetes manifests
        shell: bash
        env:
          NAMESPACE: ${{ needs.build_and_push.outputs.namespace }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          API_URL: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_API_URL_PROD != '' && vars.K8S_API_URL_PROD || vars.K8S_API_URL || '/api') || (vars.K8S_API_URL_STAGING != '' && vars.K8S_API_URL_STAGING || vars.K8S_API_URL || '/api') }}
          FILE_UPLOAD_API_URL: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_FILE_UPLOAD_API_URL_PROD != '' && vars.K8S_FILE_UPLOAD_API_URL_PROD || vars.K8S_FILE_UPLOAD_API_URL) || (vars.K8S_FILE_UPLOAD_API_URL_STAGING != '' && vars.K8S_FILE_UPLOAD_API_URL_STAGING || vars.K8S_FILE_UPLOAD_API_URL) }}
          DATABASE_URL: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_DATABASE_URL_PROD != '' && vars.K8S_DATABASE_URL_PROD || vars.K8S_DATABASE_URL || 'sqlite:///./data/community.db') || (vars.K8S_DATABASE_URL_STAGING != '' && vars.K8S_DATABASE_URL_STAGING || vars.K8S_DATABASE_URL || 'sqlite:///./data/community.db') }}
          CORS_ALLOW_ORIGINS: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_CORS_ALLOW_ORIGINS_PROD != '' && vars.K8S_CORS_ALLOW_ORIGINS_PROD || vars.K8S_CORS_ALLOW_ORIGINS || 'http://localhost,http://127.0.0.1') || (vars.K8S_CORS_ALLOW_ORIGINS_STAGING != '' && vars.K8S_CORS_ALLOW_ORIGINS_STAGING || vars.K8S_CORS_ALLOW_ORIGINS || 'http://localhost,http://127.0.0.1') }}
          INGRESS_CLASS_NAME: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_INGRESS_CLASS_NAME_PROD != '' && vars.K8S_INGRESS_CLASS_NAME_PROD || vars.K8S_INGRESS_CLASS_NAME || 'nginx') || (vars.K8S_INGRESS_CLASS_NAME_STAGING != '' && vars.K8S_INGRESS_CLASS_NAME_STAGING || vars.K8S_INGRESS_CLASS_NAME || 'nginx') }}
          BACKEND_REPLICAS: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_BACKEND_REPLICAS_PROD != '' && vars.K8S_BACKEND_REPLICAS_PROD || '2') || (vars.K8S_BACKEND_REPLICAS_STAGING != '' && vars.K8S_BACKEND_REPLICAS_STAGING || '2') }}
          FRONTEND_REPLICAS: ${{ needs.build_and_push.outputs.deploy_target == 'prod' && (vars.K8S_FRONTEND_REPLICAS_PROD != '' && vars.K8S_FRONTEND_REPLICAS_PROD || '2') || (vars.K8S_FRONTEND_REPLICAS_STAGING != '' && vars.K8S_FRONTEND_REPLICAS_STAGING || '2') }}
        run: |
          set -euo pipefail
          mkdir -p k8s/rendered
          for template in k8s/templates/*.yaml.tpl; do
            envsubst < "$template" > "k8s/rendered/$(basename "${template%.tpl}")"
          done

      - name: Apply manifests
        shell: bash
        run: |
          set -euo pipefail
          namespace="${{ needs.build_and_push.outputs.namespace }}"

          wait_rollout() {
            local deployment_name="$1"
            if ! kubectl -n "$namespace" rollout status "deployment/$deployment_name" --timeout=360s; then
              kubectl -n "$namespace" get deploy,pods,rs -o wide
              kubectl -n "$namespace" describe "deployment/$deployment_name"
              return 1
            fi
          }

          kubectl apply -f k8s/rendered
          wait_rollout community-backend
          wait_rollout community-frontend

name: Deploy Compose On Self-Hosted EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        type: string
      compose_file:
        description: "Compose file path"
        required: false
        default: docker-compose.deploy.yml
        type: string
      backend_ref:
        description: "Backend git ref (optional, default: vars.BACKEND_REF or main)"
        required: false
        type: string

permissions:
  contents: read

env:
  BACKEND_REPO: ${{ vars.BACKEND_REPO != '' && vars.BACKEND_REPO || '80-hours-a-week/2-sungjin-community-be' }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      compose_file: ${{ steps.vars.outputs.compose_file }}
      backend_ref: ${{ steps.vars.outputs.backend_ref }}
      deploy_target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Resolve variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::12}"
          fi

          if [ -n "${{ github.event.inputs.compose_file }}" ]; then
            COMPOSE_FILE="${{ github.event.inputs.compose_file }}"
          else
            COMPOSE_FILE="docker-compose.deploy.yml"
          fi

          if [ -n "${{ github.event.inputs.backend_ref }}" ]; then
            BACKEND_REF="${{ github.event.inputs.backend_ref }}"
          elif [ -n "${{ vars.BACKEND_REF }}" ]; then
            BACKEND_REF="${{ vars.BACKEND_REF }}"
          else
            BACKEND_REF="main"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_TARGET="prod"
          else
            DEPLOY_TARGET="staging"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "compose_file=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "backend_ref=$BACKEND_REF" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$DEPLOY_TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ steps.vars.outputs.backend_ref }}
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN != '' && secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/community-frontend:${{ steps.vars.outputs.image_tag }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/community-backend:${{ steps.vars.outputs.image_tag }}

  deploy_staging:
    runs-on: [self-hosted, linux, x64, ec2]
    needs: build_and_push
    if: needs.build_and_push.outputs.deploy_target == 'staging'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify docker runtime
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Deploy staging with local docker compose
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          TAG: ${{ needs.build_and_push.outputs.image_tag }}
          COMPOSE_FILE: ${{ vars.STAGING_COMPOSE_FILE != '' && vars.STAGING_COMPOSE_FILE || needs.build_and_push.outputs.compose_file }}
          API_URL: ${{ vars.STAGING_API_URL != '' && vars.STAGING_API_URL || vars.API_URL }}
          FILE_UPLOAD_API_URL: ${{ vars.STAGING_FILE_UPLOAD_API_URL != '' && vars.STAGING_FILE_UPLOAD_API_URL || vars.FILE_UPLOAD_API_URL }}
          COMPOSE_PROJECT_NAME: community-staging
        run: |
          set -euo pipefail
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" down --remove-orphans || true
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" pull
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" ps

  deploy_prod:
    runs-on: [self-hosted, linux, x64, ec2]
    needs: build_and_push
    if: needs.build_and_push.outputs.deploy_target == 'prod'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify docker runtime
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Deploy production with local docker compose
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          TAG: ${{ needs.build_and_push.outputs.image_tag }}
          COMPOSE_FILE: ${{ vars.PROD_COMPOSE_FILE != '' && vars.PROD_COMPOSE_FILE || needs.build_and_push.outputs.compose_file }}
          API_URL: ${{ vars.PROD_API_URL != '' && vars.PROD_API_URL || vars.API_URL }}
          FILE_UPLOAD_API_URL: ${{ vars.PROD_FILE_UPLOAD_API_URL != '' && vars.PROD_FILE_UPLOAD_API_URL || vars.FILE_UPLOAD_API_URL }}
          COMPOSE_PROJECT_NAME: community-prod
        run: |
          set -euo pipefail
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" down --remove-orphans || true
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" pull
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d
          DOCKERHUB_USER="$DOCKERHUB_USER" TAG="$TAG" API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" ps
